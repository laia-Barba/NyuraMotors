<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Modelos - NyuraMotors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Panel.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="../components/modal.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .admin-header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(20px);
        }
        
        .admin-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .admin-subtitle {
            font-family: 'Inter', sans-serif;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
            align-items: stretch;
        }
        
        .model-card {
            background: linear-gradient(145deg, rgba(20, 20, 30, 0.95), rgba(30, 30, 40, 0.9));
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .model-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.15);
        }
        
        .model-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }
        .model-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .model-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .model-price {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        .model-specs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }
        
        .spec-label {
            font-family: 'Inter', sans-serif;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .spec-value {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .model-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: auto;
            padding-top: 1rem;
        }
        
        .btn-edit, .btn-delete {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .btn-edit {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.25);
        }
        
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(102, 126, 234, 0.35);
        }
        
        .btn-delete {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        
        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }
        
        .add-model-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 50px;
            padding: 1rem 2rem;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        
        .add-model-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }
        
        .error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.2);
            border-radius: 8px;
            padding: 1rem;
            color: #e74c3c;
            margin-bottom: 2rem;
        }
        
        .success {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.2);
            border-radius: 8px;
            padding: 1rem;
            color: #2ecc71;
            margin-bottom: 2rem;
        }
        
        @media (max-width: 768px) {
            .admin-container {
                padding: 1rem;
            }
            
            .models-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .admin-header {
                padding: 1.5rem;
            }
            
            .admin-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
    <nav>
        <a href="Panel.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            Volver Atrás
        </a>
    </nav>
</header>
    
    <main>
        <div class="models-header">
            <h1>Gestión de Modelos</h1>
            <button class="add-model-btn" onclick="openAddModal()">
                <i class="fas fa-plus"></i>
                Añadir Nuevo Modelo
            </button>
        </div>
            
        <div id="messages"></div>
            
            <div id="modelsContainer" class="models-grid">
                <div class="loading">Cargando modelos...</div>
            </div>
        </div>
    </main>

    <!-- Modal para añadir/editar modelo -->
    <div id="modelModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">Añadir Modelo</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="modelForm" class="form">
                    <div class="form__row">
                        <div class="field">
                            <label class="field__label">Nombre del Modelo</label>
                            <input type="text" id="modelName" class="field__input" required>
                        </div>
                        <div class="field">
                            <label class="field__label">Gama</label>
                            <select id="modelGama" class="field__input" required>
                                <option value="">Selecciona una gama</option>
                                <option value="R">R</option>
                                <option value="Electric">Electric</option>
                                <option value="Nyura">Nyura</option>
                            </select>
                        </div>
                    </div>

                    <div class="form__row">
                        <div class="field">
                            <label class="field__label">Precio</label>
                            <input type="number" id="modelPrice" class="field__input" min="0" step="0.01" required>
                        </div>
                    </div>
                    
                    <div class="field">
                        <label class="field__label">Imagen del Modelo</label>
                        <div class="image-upload-container">
                            <div class="image-preview" id="imagePreview">
                                <span class="image-preview__placeholder">Sin imagen</span>
                            </div>
                            <div class="image-upload-controls">
                                <input type="file" id="modelImageFile" class="image-upload__input" accept="image/*">
                                <button type="button" class="image-upload__btn" onclick="document.getElementById('modelImageFile').click()">Seleccionar imagen</button>
                                <button type="button" class="image-upload__btn image-upload__btn--upload" id="uploadImageBtn" onclick="uploadModelImageFile()">Subir</button>
                                <div class="image-upload__status" id="imageUploadStatus"></div>
                            </div>
                            <input type="hidden" id="modelImage" class="field__input">
                        </div>
                    </div>
                    
                    <div class="field">
                        <label class="field__label">Descripción Corta</label>
                        <textarea id="modelDescription" class="field__input field__input--textarea" rows="3" placeholder="Descripción corta para mostrar en la card"></textarea>
                    </div>

                    <div class="field">
                        <label class="field__label">Descripción Completa</label>
                        <textarea id="modelFullDescription" class="field__input field__input--textarea" rows="6" placeholder="Descripción completa del modelo"></textarea>
                    </div>

                    <div class="field">
                        <label class="field__label">Colores disponibles</label>
                        <div id="modelColors" class="model-colors-selector">
                            <div class="loading">Cargando colores...</div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field__label">Llantas disponibles</label>
                        <div id="modelLlantas" class="model-llantas-selector">
                            <div class="loading">Cargando llantas...</div>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field__label">Paquetes disponibles</label>
                        <div id="modelPaquetes" class="model-paquetes-selector">
                            <div class="loading">Cargando paquetes...</div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="modal-accept" onclick="saveModel()">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getCurrentUser, onAuthStateChange, getModels, createModel, updateModel, deleteModel, toggleModelStatus, getColores, setModelColors, uploadModelImage, getLlantas, setModelLlantas, getPaquetes, setModelPaquetes } from '../../controlador/BBDD/SupabaseCliente.js';
        import { showAlert, showConfirm } from '../components/modal.js';
        
        let currentEditingId = null;
        let models = [];
        let allColors = [];
        let allLlantas = [];
        let allPaquetes = [];
        let uploadedImageUrl = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si el usuario es administrador
            getCurrentUser().then(user => {
                if (!user) {
                    window.location.href = 'InicioSesion.html';
                    return;
                }
                
                // Aquí podrías verificar si el usuario tiene rol de administrador
                loadModels();
            });
            
            // Cerrar modal al hacer clic fuera
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('modelModal');
                if (event.target === modal) {
                    closeModal();
                }
            });
        });
        
        async function loadModels() {
            try {
                const result = await getModels();
                if (result.success) {
                    // Forzar actualización del array models con datos frescos
                    models = result.data;
                    console.log('loadModels - Array models actualizado:', models);
                    displayModels(models);
                    return result; // Devolver el resultado para que se pueda usar en .then()
                } else {
                    showMessage('Error al cargar modelos: ' + result.error, 'error');
                    return result; // Devolver el resultado incluso si hay error
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error inesperado al cargar modelos', 'error');
                return { success: false, error: error.message }; // Devolver un resultado de error
            }
        }

        async function loadColors() {
            try {
                allColors = await getColores();
            } catch (error) {
                console.error('Error cargando colores:', error);
                allColors = [];
            }
        }

        async function loadLlantas() {
            try {
                const result = await getLlantas();
                console.log('loadLlantas - Resultado:', result);
                allLlantas = Array.isArray(result) ? result : (result.success ? result.data : []);
                console.log('loadLlantas - allLlantas:', allLlantas);
            } catch (error) {
                console.error('Error cargando llantas:', error);
                allLlantas = [];
            }
        }

        async function loadPaquetes() {
            try {
                const result = await getPaquetes();
                console.log('loadPaquetes - Resultado:', result);
                allPaquetes = Array.isArray(result) ? result : (result.success ? result.data : []);
                console.log('loadPaquetes - allPaquetes:', allPaquetes);
            } catch (error) {
                console.error('Error cargando paquetes:', error);
                allPaquetes = [];
            }
        }

        function renderColorsSelector(selectedColorIds = []) {
            const container = document.getElementById('modelColors');
            if (!container) return;

            if (!allColors || allColors.length === 0) {
                container.innerHTML = '<div class="loading">No hay colores disponibles</div>';
                return;
            }

            const selectedSet = new Set((selectedColorIds || []).map((id) => Number(id)));

            container.innerHTML = allColors
                .map((color) => {
                    const isChecked = selectedSet.has(Number(color.id));
                    const hex = color.hex || '#ffffff';
                    const extra = Number(color.precio_extra || 0);
                    return `
                        <label class="color-choice">
                            <input type="checkbox" class="color-choice__check" value="${color.id}" ${isChecked ? 'checked' : ''}>
                            <span class="color-choice__swatch" style="background-color: ${hex}"></span>
                            <span class="color-choice__name">${color.nombre || 'Color'}</span>
                            ${extra > 0 ? `<span class="color-choice__extra">+${formatPrice(extra)}</span>` : ''}
                        </label>
                    `;
                })
                .join('');
        }

        function renderLlantasSelector(selectedLlantaIds = []) {
            const container = document.getElementById('modelLlantas');
            if (!container) return;

            if (!allLlantas || allLlantas.length === 0) {
                container.innerHTML = '<div class="loading">No hay llantas disponibles</div>';
                return;
            }

            const selectedSet = new Set((selectedLlantaIds || []).map((id) => Number(id)));

            container.innerHTML = allLlantas
                .map((llanta) => {
                    const isChecked = selectedSet.has(Number(llanta.id));
                    const extra = Number(llanta.precio_extra || 0);
                    const medida = llanta.medida || '';
                    return `
                        <label class="color-choice">
                            <input type="checkbox" class="color-choice__check" value="${llanta.id}" ${isChecked ? 'checked' : ''}>
                            <span class="color-choice__name">${llanta.nombre || 'Llanta'}</span>
                            ${medida ? `<span class="color-choice__extra">${medida}</span>` : ''}
                            ${extra > 0 ? `<span class="color-choice__extra">+${formatPrice(extra)}</span>` : ''}
                        </label>
                    `;
                })
                .join('');
        }

        function renderPaquetesSelector(selectedPaqueteIds = []) {
            const container = document.getElementById('modelPaquetes');
            if (!container) return;

            if (!allPaquetes || allPaquetes.length === 0) {
                container.innerHTML = '<div class="loading">No hay paquetes disponibles</div>';
                return;
            }

            const selectedSet = new Set((selectedPaqueteIds || []).map((id) => Number(id)));

            container.innerHTML = allPaquetes
                .map((paquete) => {
                    const isChecked = selectedSet.has(Number(paquete.id));
                    const precio = Number(paquete.precio || 0);
                    const descripcion = paquete.descripcion || '';
                    return `
                        <label class="color-choice">
                            <input type="checkbox" class="color-choice__check" value="${paquete.id}" ${isChecked ? 'checked' : ''}>
                            <span class="color-choice__name">${paquete.nombre || 'Paquete'}</span>
                            ${precio > 0 ? `<span class="color-choice__extra">+${formatPrice(precio)}</span>` : ''}
                            ${descripcion ? `<span class="color-choice__extra">${descripcion}</span>` : ''}
                        </label>
                    `;
                })
                .join('');
        }

        function displayModels(modelsToDisplay) {
            const container = document.getElementById('modelsContainer');
            
            if (modelsToDisplay.length === 0) {
                container.innerHTML = '<div class="loading">No hay modelos disponibles</div>';
                return;
            }
            
            console.log('displayModels - Renderizando con datos:', modelsToDisplay);
            container.innerHTML = modelsToDisplay.map(model => {
                // Debug: log para ver qué contiene el campo imagen
                console.log(`Modelo ${model.nombre}:`, {
                    imagen: model.imagen,
                    Imagenes_Modelos: model.Imagenes_Modelos
                });
                
                const imageUrl = model.imagen || model.Imagenes_Modelos || null;
                console.log(`displayModels - imageUrl para ${model.nombre}:`, imageUrl);
                // Forzar uso directo de la URL si existe
                const imageSrc = imageUrl ? imageUrl : null;
                
                return `
                <div class="model-card">
                    ${imageSrc ? `<img src="${imageSrc}" 
                         alt="${model.nombre}" 
                         class="model-image"
                         loading="lazy"
                         onerror="this.onerror=null; console.error('Error cargando imagen:', this.src); this.src='https://picsum.photos/seed/default/400/200.jpg'">` : '<div class="model-image-placeholder"></div>'}
                    <div class="model-content">
                        <div class="model-header">
                            <h3 class="model-name">${model.nombre}</h3>
                            <span class="model-gama">${model.gama}</span>
                        </div>
                        <div class="model-price">${formatPrice(model.precio)}</div>
                        ${model.descripcion_corta ? `<p class="model-description">${model.descripcion_corta}</p>` : ''}
                        <div class="model-status">
                            <span class="status-label">Estado:</span>
                            <span class="status-value ${model.activo ? 'active' : 'inactive'}">
                                ${model.activo ? 'Activo' : 'Inactivo'}
                            </span>
                            <button class="btn-toggle ${model.activo ? 'btn-deactivate' : 'btn-activate'}" 
                                    onclick="toggleStatus('${model.id}', ${!model.activo})">
                                <i class="fas ${model.activo ? 'fa-toggle-off' : 'fa-toggle-on'}"></i>
                                ${model.activo ? 'Desactivar' : 'Activar'}
                            </button>
                        </div>
                        ${model.modelo_colores && model.modelo_colores.length > 0 ? `
                            <div class="model-colors">
                                <h4>Colores disponibles:</h4>
                                <div class="colors-list">
                                    ${model.modelo_colores.map(mc => `
                                        <div class="color-item">
                                            <div class="color-swatch" style="background-color: ${mc.colores.hex}"></div>
                                            <span class="color-name">${mc.colores.nombre}</span>
                                            ${mc.colores.precio_extra > 0 ? `<span class="color-price">+${formatPrice(mc.colores.precio_extra)}</span>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                        ${model.modelo_llantas && model.modelo_llantas.length > 0 ? `
                            <div class="model-colors">
                                <h4>Llantas disponibles:</h4>
                                <div class="colors-list">
                                    ${model.modelo_llantas.map(ml => `
                                        <div class="color-item">
                                            <span class="color-name">${ml.llantas.nombre}</span>
                                            ${ml.llantas.precio_extra > 0 ? `<span class="color-price">+${formatPrice(ml.llantas.precio_extra)}</span>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                        ${model.modelo_paquetes && model.modelo_paquetes.length > 0 ? `
                            <div class="model-colors">
                                <h4>Paquetes disponibles:</h4>
                                <div class="colors-list">
                                    ${model.modelo_paquetes.map(mp => `
                                        <div class="color-item">
                                            <span class="color-name">${mp.paquetes.nombre}</span>
                                            ${mp.paquetes.precio > 0 ? `<span class="color-price">+${formatPrice(mp.paquetes.precio)}</span>` : ''}
                                            ${mp.paquetes.descripcion ? `<span class="color-price">${mp.paquetes.descripcion}</span>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                        <div class="model-actions">
                            <button class="btn-edit" onclick="editModel('${model.id}')">Editar</button>
                            <button class="btn-delete" onclick="confirmDelete('${model.id}')">Eliminar</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
        
        function formatPrice(price) {
            return new Intl.NumberFormat('es-ES', {
                style: 'currency',
                currency: 'EUR'
            }).format(price || 0);
        }
        
        function openAddModal() {
            currentEditingId = null;
            document.getElementById('modalTitle').textContent = 'Añadir Modelo';
            document.getElementById('modelForm').reset();
            renderColorsSelector([]);
            renderLlantasSelector([]);
            renderPaquetesSelector([]);
            document.getElementById('modelModal').style.display = 'flex';
        }
        
        function editModel(id) {
            const numericId = Number(id);
            const model = models.find(m => Number(m.id) === numericId);
            if (!model) return;
            
            currentEditingId = numericId;
            uploadedImageUrl = null; // Resetear la URL subida al editar
            document.getElementById('modalTitle').textContent = 'Editar Modelo';
            
            // Rellenar el formulario
            document.getElementById('modelName').value = model.nombre || '';
            document.getElementById('modelGama').value = model.gama || '';
            document.getElementById('modelPrice').value = model.precio || '';
            document.getElementById('modelImage').value = model.imagen || '';
            document.getElementById('modelDescription').value = model.descripcion_corta || '';
            document.getElementById('modelFullDescription').value = model.descripcion || '';

            // Mostrar imagen actual si existe
            const preview = document.getElementById('imagePreview');
            const uploadBtn = document.getElementById('uploadImageBtn');
            const status = document.getElementById('imageUploadStatus');
            
            if (model.imagen) {
                preview.innerHTML = `<img src="${model.imagen}" alt="Imagen actual" class="image-preview__img">`;
                uploadBtn.style.display = 'inline-block';
                uploadBtn.textContent = 'Reemplazar';
                status.textContent = 'Imagen actual cargada';
                status.className = 'image-upload__status image-upload__status--info';
            } else {
                preview.innerHTML = '<span class="image-preview__placeholder">Sin imagen</span>';
                uploadBtn.style.display = 'none';
                status.textContent = '';
                status.className = 'image-upload__status';
            }

            const selectedColorIds = (model.modelo_colores || []).map((mc) => mc.color_id);
            renderColorsSelector(selectedColorIds);

            const selectedLlantaIds = (model.modelo_llantas || []).map((ml) => ml.llanta_id);
            renderLlantasSelector(selectedLlantaIds);

            const selectedPaqueteIds = (model.modelo_paquetes || []).map((mp) => mp.paquete_id);
            renderPaquetesSelector(selectedPaqueteIds);

            document.getElementById('modelModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modelModal').style.display = 'none';
            document.getElementById('modelForm').reset();
            currentEditingId = null;
            uploadedImageUrl = null;
            renderColorsSelector([]);
            renderLlantasSelector([]);
            renderPaquetesSelector([]);
            
            // Resetear la vista de imagen
            const preview = document.getElementById('imagePreview');
            const uploadBtn = document.getElementById('uploadImageBtn');
            const status = document.getElementById('imageUploadStatus');
            const fileInput = document.getElementById('modelImageFile');
            
            preview.innerHTML = '<span class="image-preview__placeholder">Sin imagen</span>';
            uploadBtn.style.display = 'none';
            uploadBtn.textContent = 'Subir';
            status.textContent = '';
            status.className = 'image-upload__status';
            fileInput.value = '';
        }
        
        async function saveModel() {
            // Usar la URL de la imagen subida si existe, si no, mantener la existente
            const imageUrl = uploadedImageUrl || document.getElementById('modelImage').value || '';
            
            console.log('saveModel - Debug:', {
                currentEditingId,
                uploadedImageUrl,
                imageUrlFromInput: document.getElementById('modelImage').value,
                finalImageUrl: imageUrl
            });
            
            const formData = {
                nombre: document.getElementById('modelName').value.trim(),
                gama: document.getElementById('modelGama').value,
                precio: Number(document.getElementById('modelPrice').value),
                imagen: imageUrl.trim() || null,
                descripcion_corta: (document.getElementById('modelDescription').value || '').trim() || null,
                descripcion: (document.getElementById('modelFullDescription').value || '').trim() || null
            };

            if (!formData.nombre || !formData.gama || Number.isNaN(formData.precio)) {
                showMessage('Completa los campos obligatorios: nombre, gama y precio.', 'error');
                return;
            }
            
            try {
                let result;
                if (currentEditingId) {
                    result = await updateModel(currentEditingId, formData);
                } else {
                    formData.activo = true;
                    result = await createModel(formData);
                }
                
                if (result.success) {
                    const modelId = currentEditingId || result.data?.id;
                    const colorsContainer = document.getElementById('modelColors');
                    const checked = colorsContainer
                        ? Array.from(colorsContainer.querySelectorAll('input[type="checkbox"]:checked')).map((el) => Number(el.value))
                        : [];

                    if (modelId) {
                        const colorsResult = await setModelColors(modelId, checked);
                        if (!colorsResult.success) {
                            showMessage('Modelo guardado, pero error guardando colores: ' + colorsResult.error, 'error');
                        }
                    }

                    if (modelId) {
                        const llantasContainer = document.getElementById('modelLlantas');
                        const checkedLlantas = llantasContainer
                            ? Array.from(llantasContainer.querySelectorAll('input[type="checkbox"]:checked')).map((el) => Number(el.value))
                            : [];

                        const llantasResult = await setModelLlantas(modelId, checkedLlantas);
                        if (!llantasResult.success) {
                            showMessage('Modelo guardado, pero error guardando llantas: ' + llantasResult.error, 'error');
                        }
                    }

                    if (modelId) {
                        const paquetesContainer = document.getElementById('modelPaquetes');
                        const checkedPaquetes = paquetesContainer
                            ? Array.from(paquetesContainer.querySelectorAll('input[type="checkbox"]:checked')).map((el) => Number(el.value))
                            : [];

                        const paquetesResult = await setModelPaquetes(modelId, checkedPaquetes);
                        if (!paquetesResult.success) {
                            showMessage('Modelo guardado, pero error guardando paquetes: ' + paquetesResult.error, 'error');
                        }
                    }

                    showMessage(currentEditingId ? 'Modelo actualizado correctamente' : 'Modelo creado correctamente', 'success');
                    closeModal();
                    // Llamar a loadModels y pasar el resultado a displayModels
                    loadModels().then(result => {
                        if (result && result.success) {
                            displayModels(result.data);
                            // Forzar recarga completa de la página para evitar caché
                            setTimeout(() => {
                                window.location.reload();
                            }, 100);
                        } else {
                            console.error('loadModels devolvió resultado inesperado:', result);
                            // Si loadModels falla, recargar igualmente para mostrar datos frescos
                            setTimeout(() => {
                                window.location.reload();
                            }, 100);
                        }
                    }).catch(error => {
                        console.error('Error en loadModels:', error);
                        // Si hay error, recargar igualmente
                        setTimeout(() => {
                            window.location.reload();
                        }, 100);
                    });
                } else {
                    showMessage('Error: ' + result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error inesperado', 'error');
            }
        }

        // Cargar colores y llantas al iniciar
        document.addEventListener('DOMContentLoaded', async function() {
            await loadColors();
            await loadLlantas();
            await loadPaquetes();
            renderColorsSelector([]);
            renderLlantasSelector([]);
            renderPaquetesSelector([]);

            // Configurar evento de selección de archivo
            document.getElementById('modelImageFile').addEventListener('change', handleImageFileSelect);
        });

        // Manejar selección de archivo de imagen
        function handleImageFileSelect(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');
            const uploadBtn = document.getElementById('uploadImageBtn');
            const status = document.getElementById('imageUploadStatus');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview" class="image-preview__img">`;
                    uploadBtn.style.display = 'inline-block';
                    status.textContent = '';
                    status.className = 'image-upload__status';
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '<span class="image-preview__placeholder">Sin imagen</span>';
                uploadBtn.style.display = 'none';
                status.textContent = '';
                status.className = 'image-upload__status';
            }
        }

        // Subir imagen a Supabase Storage
        async function uploadModelImageFile() {
            const fileInput = document.getElementById('modelImageFile');
            const file = fileInput.files[0];
            const status = document.getElementById('imageUploadStatus');
            const uploadBtn = document.getElementById('uploadImageBtn');
            
            if (!file) {
                status.textContent = 'Por favor, selecciona una imagen primero';
                status.className = 'image-upload__status image-upload__status--error';
                return;
            }
            
            // Deshabilitar botón durante la subida
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Subiendo...';
            status.textContent = 'Subiendo imagen...';
            status.className = 'image-upload__status image-upload__status--uploading';
            
            try {
                // Obtener el nombre del modelo y la imagen vieja
                const modelName = document.getElementById('modelName').value.trim();
                const oldImageUrl = document.getElementById('modelImage').value.trim();
                
                console.log('uploadModelImageFile - Datos:', {
                    modelName,
                    oldImageUrl,
                    currentEditingId
                });
                
                const result = await uploadModelImage(file, currentEditingId, modelName, oldImageUrl);
                
                if (result.success) {
                    uploadedImageUrl = result.publicUrl;
                    document.getElementById('modelImage').value = uploadedImageUrl;
                    status.textContent = 'Imagen subida correctamente';
                    status.className = 'image-upload__status image-upload__status--success';
                    uploadBtn.textContent = 'Reemplazar';
                } else {
                    status.textContent = 'Error: ' + result.error;
                    status.className = 'image-upload__status image-upload__status--error';
                    uploadBtn.textContent = 'Subir';
                }
            } catch (error) {
                console.error('Error subiendo imagen:', error);
                status.textContent = 'Error inesperado al subir imagen';
                status.className = 'image-upload__status image-upload__status--error';
                uploadBtn.textContent = 'Subir';
            } finally {
                uploadBtn.disabled = false;
            }
        }
        
        function confirmDelete(id) {
            showConfirm('Eliminar modelo', '¿Estás seguro de que quieres eliminar este modelo? Esta acción no se puede deshacer.', () => {
                deleteModelFromUI(id);
            });
        }
        
        // Exportar funciones al ámbito global para onclick
        window.uploadModelImageFile = uploadModelImageFile;
        window.deleteModelFromUI = deleteModelFromUI;
        window.confirmDelete = confirmDelete;
        
        async function deleteModelFromUI(id) {
            try {
                const result = await deleteModel(id);
                if (result.success) {
                    showMessage('Modelo eliminado correctamente', 'success');
                    loadModels();
                } else {
                    showMessage('Error al eliminar modelo: ' + result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error inesperado al eliminar modelo', 'error');
            }
        }
        
        async function toggleStatus(id, newStatus) {
            try {
                const result = await toggleModelStatus(id, newStatus);
                if (result.success) {
                    showMessage(`Modelo ${newStatus ? 'activado' : 'desactivado'} correctamente`, 'success');
                    loadModels();
                } else {
                    showMessage('Error al cambiar estado del modelo: ' + result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Error inesperado al cambiar estado del modelo', 'error');
            }
        }
        
        function showMessage(message, type) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            messagesContainer.appendChild(messageDiv);
            
            // Auto-eliminar después de 5 segundos
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
        
        // Hacer las funciones globales para que puedan ser llamadas desde el HTML
        window.openAddModal = openAddModal;
        window.closeModal = closeModal;
        window.saveModel = saveModel;
        window.editModel = editModel;
        window.confirmDelete = confirmDelete;
        window.toggleStatus = toggleStatus;
    </script>
</body>
</html>
