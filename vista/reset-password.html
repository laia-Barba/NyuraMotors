<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyura Motors - Restablecer contraseña</title>
    <link rel="stylesheet" href="EstiloPrincipal.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="header-unique.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        main { margin-top: 0; }
    </style>
</head>
<body>
    <main>
        <section class="auth-page">
            <div class="auth-card">
                <div class="auth-content">
                    <div class="auth-row">
                        <a class="auth-link" href="InicioSesion.html">
                            <span aria-hidden="true">←</span>
                            <span>Volver</span>
                        </a>
                    </div>

                    <p class="auth-kicker">Nyura Motors</p>
                    <h1 class="auth-title">Restablecer contraseña</h1>

                    <form class="auth-form" action="#" method="post" novalidate>
                        <label>
                            <span>Nueva contraseña</span>
                            <input class="auth-input" type="password" name="password" autocomplete="new-password" placeholder="Nueva contraseña" required>
                        </label>

                        <label>
                            <span>Repetir contraseña</span>
                            <input class="auth-input" type="password" name="password2" autocomplete="new-password" placeholder="Repite la contraseña" required>
                        </label>

                        <button class="auth-submit" type="submit">Guardar contraseña</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

<script type="module">
    import { supabase } from '../controlador/BBDD/SupabaseCliente.js';

    document.addEventListener('DOMContentLoaded', async function() {
        const form = document.querySelector('.auth-form');
        const pass1 = form.querySelector('[name="password"]');
        const pass2 = form.querySelector('[name="password2"]');
        const submitBtn = form.querySelector('.auth-submit');

        const showInlineMessage = (text, targetEl) => {
            const existing = targetEl.parentNode.querySelector('.field-error');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'field-error';
            div.textContent = text;
            targetEl.parentNode.appendChild(div);
        };

        const clearErrors = () => {
            document.querySelectorAll('.field-error').forEach(el => el.remove());
        };

        const hash = window.location.hash || '';
        const hashParams = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
        const access_token = hashParams.get('access_token');
        const refresh_token = hashParams.get('refresh_token');
        const type = hashParams.get('type');

        if (!access_token || !refresh_token || (type && type !== 'recovery')) {
            showInlineMessage('El enlace de recuperación no es válido o ha expirado. Solicita uno nuevo.', pass1);
            submitBtn.disabled = true;
            return;
        }

        try {
            const { error } = await supabase.auth.setSession({ access_token, refresh_token });
            if (error) {
                showInlineMessage('No se pudo validar el enlace. Solicita uno nuevo.', pass1);
                submitBtn.disabled = true;
                return;
            }
        } catch (e) {
            console.error('Error setSession:', e);
            showInlineMessage('Error inesperado validando el enlace.', pass1);
            submitBtn.disabled = true;
            return;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearErrors();

            const p1 = (pass1.value || '').trim();
            const p2 = (pass2.value || '').trim();

            if (!p1) {
                showInlineMessage('La contraseña es obligatoria', pass1);
                return;
            }

            if (p1.length < 6) {
                showInlineMessage('La contraseña debe tener al menos 6 caracteres', pass1);
                return;
            }

            if (p1 !== p2) {
                showInlineMessage('Las contraseñas no coinciden', pass2);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            try {
                const { error } = await supabase.auth.updateUser({ password: p1 });
                if (error) {
                    showInlineMessage(error.message || 'No se pudo actualizar la contraseña', pass1);
                    return;
                }

                showInlineMessage('Contraseña actualizada. Ya puedes iniciar sesión.', pass1);

                setTimeout(() => {
                    window.location.href = 'InicioSesion.html';
                }, 1200);
            } catch (err) {
                console.error('Error updateUser:', err);
                showInlineMessage('Error inesperado actualizando la contraseña', pass1);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar contraseña';
            }
        });

        pass1.addEventListener('input', clearErrors);
        pass2.addEventListener('input', clearErrors);
    });
</script>
</body>
</html>
